version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:14-alpine
    container_name: staging_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: staging_db
    ports:
      - "5432:5432" # Optional: For local access

  # 2. Python Extractor/Loader Service
  python_etl:
    build:
      context: ./python_extractor
      dockerfile: Dockerfile
    container_name: python_extractor
    # Wait for the database to be running before starting
    #depends_on:
      #postgres_db:
       # condition: service_healthy # Best practice if using a healthcheck (not shown)
                                   # or: condition: service_started
    # The script itself handles the DB connection wait, so service_started is sufficient
    depends_on:
      - postgres_db
    # This service will run E&L once and then exit.
    # We will trigger it using `docker compose run` in the cron job.

  # 3. dbt Transformer Service
  dbt_transform:
    build:
      context: ./dbt_transformer
      dockerfile: Dockerfile
    container_name: dbt_transformer
    # dbt needs the DB, but also needs the raw data loaded by python_etl
    # In a one-off run, we trigger dbt *after* python_etl has finished.
    depends_on:
      - postgres_db
    environment:
      # Optional: Pass connection details as environment variables for dbt
      DB_HOST: postgres_db
      DB_USER: user
      DB_PASS: password
      DB_NAME: staging_db
    # This service will be executed using `docker compose run` in the cron job.